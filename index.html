<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const S=Object.assign({xp:0,streak:0,last:'',hist:{},name:'',sb:{url:'',key:''},q:[],best:0,lv:1,stat:{},mis:[],rec:[],key:'',model:'gemini-3.7-flash',pid:Math.random().toString(36).slice(2)},JSON.parse(LS.get('pm')||'{}'));
const save=()=>LS.set('pm',JSON.stringify(S));
const ymd=o=>new Date(Date.now()+o*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ymd(0);
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1)),pick=(r,a)=>a[Math.floor(r()*a.length)],shuf=(r,a)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const inr=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2});
const fv=(v,u)=>u==='₹'?inr(v):u==='%'?(+v.toFixed(2))+'%':(+v.toFixed(2)).toLocaleString('en-IN');
const G=[
r=>{const o=ri(r,4,20)*100,p=pick(r,[10,12,15,20,25,30,40]),n=o*(100+p)/100;return{t:`A stock moves from ${inr(o)} to ${inr(n)}. What is the % gain?`,a:p,u:'%',e:`(${n} − ${o}) ÷ ${o} × 100 = ${p}%`}},
r=>{const p=pick(r,[10,20,25,30,40,50]);return{t:`Your portfolio rises ${p}% in year 1, then falls ${p}% in year 2. Net change in %? (use − for a loss)`,a:-p*p/100,u:'%',d:[0,p],e:`(1+${p}%)×(1−${p}%) = 1 − ${p}²/100, so net −${p*p/100}%`}},
r=>{const P=ri(r,2,20)*5000,R=ri(r,6,12),T=ri(r,2,5),a=P*R*T/100;return{t:`${inr(P)} is invested at ${R}% simple interest for ${T} years. Interest earned?`,a,u:'₹',e:`${P} × ${R} × ${T} ÷ 100 = ${inr(a)}`}},
r=>{const P=ri(r,1,10)*10000,R=pick(r,[10,20]),a=Math.round(P*((1+R/100)**2-1));return{t:`${inr(P)} is invested at ${R}% compound interest (yearly) for 2 years. Compound interest earned?`,a,u:'₹',d:[P*R*2/100],e:`Amount = ${P} × ${(1+R/100)**2} → interest ${inr(a)}`}},
r=>{const I=ri(r,5,50)*1000,p=pick(r,[-20,-10,-5,8,12,15,25,40]),V=I*(100+p)/100;return{t:`You invested ${inr(I)}; it is now worth ${inr(V)}. Return in %? (use − for a loss)`,a:p,u:'%',e:`(${V} − ${I}) ÷ ${I} × 100 = ${p}%`}},
r=>{const O=ri(r,5,40)*1000,p=pick(r,[10,20,25,50]),V=O*(100+p)/100;return{t:`After a ${p}% rise, a fund is worth ${inr(V)}. What was it worth before the rise?`,a:O,u:'₹',d:[V*(100-p)/100],e:`${V} ÷ ${(100+p)/100} = ${inr(O)}`}},
r=>{const[m,d,a]=pick(r,[[50,20,20],[40,25,5],[25,10,12.5],[60,25,20],[20,10,8],[50,10,35]]);return{t:`A trader marks goods up ${m}% over cost, then gives a ${d}% discount. Profit % on cost?`,a,u:'%',d:[m-d],e:`${(100+m)/100} × ${(100-d)/100} = ${(100+m)*(100-d)/10000} → ${a}% profit`}},
r=>{const u=ri(r,2,20)*100,c=pick(r,[100,150,200,250]),v=pick(r,[150,200,300]),F=u*c;return{t:`Fixed cost ${inr(F)}/month. Price ${inr(c+v)}, variable cost ${inr(v)} per unit. Break-even units?`,a:u,u:'',e:`Contribution ${c}; ${F} ÷ ${c} = ${u}`}},
r=>{const C=ri(r,2,20)*100,p=pick(r,[25,50,100,20]),a=+(p/(100+p)*100).toFixed(2);return{t:`An item costs ${inr(C)} and is sold at a ${p}% markup. Profit margin on selling price (%)?`,a,u:'%',d:[p],e:`Margin = ${p} ÷ ${100+p} × 100 = ${a}%`}},
r=>{const X=ri(r,2,40)*500,p=pick(r,[10,20,25,50]),a=X*(100+p)/100;return{t:`Your monthly SIP of ${inr(X)} is raised by ${p}%. New SIP?`,a,u:'₹',d:[X*p/100],e:`${X} × ${(100+p)/100} = ${inr(a)}`}},
r=>{const w=pick(r,[25,50,60,70,80]),x=pick(r,[10,12,15,20]),y=pick(r,[2,4,5,6]),a=(w*x+(100-w)*y)/100;return{t:`${w}% of your money earns ${x}% and the rest earns ${y}%. Overall return?`,a,u:'%',d:[(x+y)/2],e:`(${w}×${x} + ${100-w}×${y}) ÷ 100 = ${a}%`}}];
G.push(
r=>{const X=ri(r,2,20)*500,g=pick(r,[5,12,18]),a=X*(100+g)/100;return{t:`A phone costs ${inr(X)} before ${g}% GST. Final price you pay?`,a,u:'₹',d:[X*g/100],e:`GST = ${X} × ${g}% = ${X*g/100}; price + GST = ${inr(a)}`}},
r=>{const p=pick(r,[5,10,20,25]),X=ri(r,1,10)*5,a=X*100/p;return{t:`An investor puts ₹${X} lakh into your startup for ${p}% of it. What is the whole startup worth after this (in ₹ lakh)?`,a,u:'',e:`₹${X} lakh buys ${p}%; 1% = ${X/p} lakh; 100% = ${a} lakh`}},
r=>{const o=pick(r,[40,50,60,80]),n=pick(r,[10,20,25]),a=o*(100-n)/100;return{t:`You own ${o}% of a startup. New shares are issued so new investors hold ${n}%. Your stake now (%)?`,a,u:'%',d:[o-n],e:`You keep ${100-n}% of your old stake; ${o} × ${(100-n)/100} = ${a}%`}},
r=>{const[x,y,z]=pick(r,[[10,10,20],[20,20,25],[50,10,40]]),a=Math.round(((1+x/100)*(1+y/100)*(1-z/100)-1)*1e4)/100;return{t:`A stock rises ${x}%, rises ${y}% and then falls ${z}%. Net change in %? (use − for a loss)`,a,u:'%',d:[x+y-z],e:`${1+x/100} × ${1+y/100} × ${1-z/100} = ${+(1+a/100).toFixed(4)}; so the net change is ${a}%`}},
r=>{const P=ri(r,1,10)*50000,R=pick(r,[10,20,25]),V=Math.round(P*(1+R/100)**2);return{t:`${inr(P)} grows to ${inr(V)} in 2 years, by the same % each year. Yearly growth rate?`,a:R,u:'%',d:[(V-P)/P*50],e:`${V} ÷ ${P} = ${+(V/P).toFixed(4)}; this is (1 + r)², so 1 + r = ${1+R/100}; r = ${R}%`}},
r=>{const M=ri(r,3,20)*100,d=pick(r,[10,20,25]),V=M*(100-d)/100;return{t:`After a ${d}% discount a shirt is sold for ${inr(V)}. What was its marked price?`,a:M,u:'₹',d:[V*(100+d)/100],e:`Sold price = ${100-d}% of the marked price; ${V} ÷ ${(100-d)/100} = ${inr(M)}`}});
const GM=[['pct',1],['succ',2],['si',1],['ci',2],['ret',1],['rev',2],['markup',2],['be',1],['margin',2],['sip',1],['wavg',2],['gst',1],['val',2],['dil',2],['three',3],['cagr',3],['mrp',2]],LVN=['Easy','Medium','Hard'];
const TN={pct:'% change',succ:'Successive %',si:'Simple interest',ci:'Compound interest',ret:'Investment return',rev:'Reverse %',markup:'Markup & discount',be:'Break-even',margin:'Margin vs markup',sip:'SIP step-up',wavg:'Weighted return',gst:'GST',val:'Startup valuation',dil:'Dilution',three:'Chained % changes',cagr:'Growth rate',mrp:'Discount on marked price'};
const ID={pct:'Percent change = how much it moved ÷ where it STARTED.',succ:'Gains and losses do not cancel: the second % works on the new, changed price.',si:'Simple interest is the same every year: money × rate × years ÷ 100.',ci:'Compound interest = interest on interest. Grow the money one year at a time.',ret:'Return = (value now − money put in) ÷ money put in.',rev:'To undo a % rise, DIVIDE by 1.xx. Do not subtract the %.',markup:'Markup and discount multiply (1.40 × 0.90). Never add or subtract the percents.',be:'Break-even = fixed cost ÷ what each unit adds after its variable cost.',margin:'Margin uses the SELLING price. Markup uses the COST price.',sip:'A rise of p% means multiply by 1 + p/100.',wavg:'Each return counts in proportion to how much money is in it.',gst:'GST is a % added on top of the price.',val:'If ₹X buys p%, then 1% costs X ÷ p, and the whole company is 100 times that.',dil:'New shares shrink your slice: you keep (100 − new%) of your old stake.',three:'Multiply each step: a rise is ×1.xx, a fall is ×0.xx. Then compare with 1.',cagr:'Same % growth each year: find end ÷ start, then undo the squaring.',mrp:'The selling price is (100 − discount)% of the marked price, so divide by that.'};
const TW={succ:'You treated the rise and the fall as cancelling out, but the fall works on a bigger price',ci:'You used simple interest (same every year) instead of interest on interest',rev:'You took the % off the final price instead of dividing by 1.xx',markup:'You subtracted the percents instead of multiplying them',margin:'You gave the markup % instead of dividing by the selling price',sip:'You gave only the extra amount, not the new total',wavg:'You took a plain average and ignored how much money is in each',gst:'You gave only the tax amount, not price + tax',three:'You added and subtracted the percents instead of multiplying',cagr:'You split the total gain evenly across the years, which ignores compounding',mrp:'You added the discount on top instead of dividing by (100 − discount)%',dil:'You subtracted the new % from yours instead of scaling your stake'};
const GL={markup:['Markup','The extra % you add on top of what YOU paid. Always counted on the cost price.','Bike bought for ₹10,000 and priced at ₹12,000: you added ₹2,000. Markup = 2,000 ÷ 10,000 = 20%.'],margin:['Profit margin','Profit as a % of the SELLING price (what the customer pays).','Same bike: profit ₹2,000 ÷ selling price ₹12,000 = 16.7%. Markup was 20%, margin is only 16.7%.'],discount:['Discount','A cut from the listed price.','Bike tagged ₹12,000 with 10% off: you pay ₹10,800.'],cp:['Cost price','What the seller paid to get the item.','Dealer buys the bike for ₹10,000: cost price = ₹10,000.'],sp:['Selling price','What the buyer actually pays.','Dealer sells the bike for ₹12,000: selling price = ₹12,000.'],mp:['Marked price (MRP)','The price printed on the tag, before any discount.','The tag on the bike says ₹12,000: that is the marked price.'],profit:['Profit','Selling price minus cost price. If it comes out negative, it is a loss.','12,000 − 10,000 = ₹2,000 profit. Sell at ₹9,000 and it is a ₹1,000 loss.'],pchange:['Percent change','How much a value moved, compared with where it STARTED.','Bike price goes ₹10,000 to ₹11,000: moved ₹1,000 ÷ 10,000 (the old price) = 10% rise.'],succ:['Successive change','One % change after another. Each one works on the new value.','Bike +20% then −20%: 10,000 → 12,000 → 9,600. You are ₹400 down, not even.'],si:['Simple interest','Interest paid only on the original money, the same every year.','₹10,000 at 10% for 3 years = ₹1,000 × 3 = ₹3,000.'],ci:['Compound interest','Interest on your money PLUS the earlier interest ("interest on interest").','₹10,000 at 10%: year 1 gives 11,000, year 2 gives 12,100. Interest = ₹2,100 (simple would give ₹2,000).'],principal:['Principal','The original money you invest or borrow.','You put ₹10,000 in a bank: principal = ₹10,000.'],be:['Break-even','The number of sales where profit is exactly zero.','Rent ₹20,000 a month, each bike service earns ₹500 after parts: 40 services to break even.'],fixed:['Fixed cost','A cost that stays the same however much you sell.','Shop rent ₹20,000 a month, whether you sell 1 bike or 50.'],variable:['Variable cost','A cost that grows with every unit you sell.','Every bike sold comes with a ₹500 helmet: cost rises with each sale.'],contrib:['Contribution','Price minus variable cost: what each sale adds towards paying the fixed costs.','Bike sells for ₹12,000, bike + helmet cost ₹10,500: contribution = ₹1,500 per bike.'],sip:['SIP','Putting a fixed amount into an investment every month.','Saving ₹2,000 every month for a new bike is like a SIP.'],ret:['Return (ROI)','Gain as a % of the money you put in.','Buy a bike for ₹10,000, sell for ₹12,000: return = 2,000 ÷ 10,000 = 20%.'],cagr:['Growth rate','The steady yearly % that takes you from the start value to the end value.','A bike fund grows ₹1,00,000 to ₹1,21,000 in 2 years: 10% a year.'],dilution:['Dilution','Your % ownership shrinks when new shares are issued.','You own 50% of a bike-rental startup. New investors take 20%: you now own 50% × 0.8 = 40%.'],valuation:['Valuation','What the whole company is worth.','If ₹10 lakh buys 10% of a bike startup, the whole startup is valued at ₹1 crore.'],equity:['Equity / stake','Your ownership share in a company.','Own 25 of 100 shares in the bike shop: 25% equity.'],gst:['GST','A tax % added on the price of goods and services.','Helmet ₹1,000 + 18% GST: you pay ₹1,180.'],ltv:['LTV','Total profit you expect from one customer over time.','A customer services the bike 6 times and you earn ₹100 each time: LTV = ₹600.'],cac:['CAC','What it costs you to win one customer.','Spend ₹5,000 on ads and get 10 customers: CAC = ₹500.'],runway:['Runway','How many months the cash lasts at the current spending.','₹60 lakh in the bank, spending ₹5 lakh a month: 12 months.'],burn:['Burn rate','The cash a startup loses each month.','Spending ₹5 lakh, earning ₹1 lakh: burning ₹4 lakh a month.'],churn:['Churn','The % of customers who leave in a period.','100 members, 5 quit this month: 5% churn.'],unicorn:['Unicorn','A private startup valued at $1 billion or more.','Picture a bike-sharing app everyone uses, valued at ₹8,000+ crore.'],repo:['Repo rate','The rate at which the RBI lends to banks. It steers all loan rates.','Repo goes up, so your bike loan EMI usually goes up too.'],infl:['Inflation','How fast prices rise, so the same money buys less.','A ₹1,00,000 bike costs ₹1,06,000 next year at 6% inflation.'],wavg:['Weighted average','An average where bigger amounts count more.','₹80k earning 10% and ₹20k earning 5%: (80×10 + 20×5) ÷ 100 = 9%, not 7.5%.'],revenue:['Revenue','All the money coming in from sales, before any costs.','Sell 10 bikes at ₹12,000: revenue = ₹1,20,000 (that is not profit).'],pp:['Percentage point','The plain gap between two percentages.','A rate goes from 5% to 7%: up 2 percentage points (but a 40% relative rise).'],mix:['Alligation','A shortcut for mixing two prices to get a target price.','Mix ₹40 and ₹60 milk to get ₹52: the ratio comes from the gaps 8 and 12.']};
const AL=[['markup','markup'],['marked up','markup'],['profit margin','margin'],['margin','margin'],['discount','discount'],['cost price','cp'],['selling price','sp'],['marked price','mp'],['MRP','mp'],['percentage point','pp'],['percent change','pchange'],['simple interest','si'],['compound interest','ci'],['successive','succ'],['principal','principal'],['break-even','be'],['fixed cost','fixed'],['variable cost','variable'],['contribution','contrib'],['SIP','sip'],['return','ret'],['growth rate','cagr'],['dilution','dilution'],['valuation','valuation'],['post-money','valuation'],['stake','equity'],['equity','equity'],['GST','gst'],['LTV','ltv'],['CAC','cac'],['runway','runway'],['burn','burn'],['churn','churn'],['unicorn','unicorn'],['repo rate','repo'],['inflation','infl'],['weighted','wavg'],['revenue','revenue'],['alligation','mix'],['profit','profit']];
const F=[['% change','(new − old) ÷ old × 100'],['Profit % on cost price','profit ÷ cost price × 100'],['Profit margin','profit ÷ selling price × 100'],['Simple interest','money × rate × years ÷ 100'],['Compound interest','money × (1 + rate/100)^years − money'],['Break-even','fixed cost ÷ (price − variable cost)'],['Runway','cash ÷ monthly burn'],['LTV','orders × order value × margin %'],['Dilution','your % × (1 − new %)'],['Valuation','money put in ÷ % bought × 100']];
const AK={};AL.forEach(([a,k])=>AK[a.toLowerCase()]=k);
const RX=new RegExp('\\b('+AL.map(x=>x[0]).sort((a,b)=>b.length-a.length).join('|')+')\\b','gi');
const hl=t=>E(t).replace(RX,m=>`<u class=gl data-k=${AK[m.toLowerCase()]}>${m}</u>`);
function gl(k){closeSh();const g=GL[k];if(!g)return;const d=document.createElement('div');d.id='sh';d.innerHTML=`<b>${E(g[0])}</b><p>${E(g[1])}</p><p>🏍️ ${E(g[2])}</p><button class="b p" onclick="closeSh()" style="text-align:center">Got it</button>`;document.body.appendChild(d)}
function closeSh(){const d=$('#sh');if(d)d.remove()}
const lab=k=>TN[k]||SUB[k]||k;
const pool=t=>G.map((f,i)=>i).filter(i=>i<GM.length&&GM[i][1]<=S.lv&&(!t||!t.length||t.includes(GM[i][0])));
const gen=(r,n,t)=>{let p=shuf(r,pool(t));if(p.length<n)p=[...p,...shuf(r,pool())];return p.slice(0,n).map(i=>{const q=G[i](r);q.tp=GM[i][0];return{k:'m',g:'q',...mcq(q,r)}})};
function track(q,ok,why){const k=q.tp||q.g||'x',t=S.stat[k]||(S.stat[k]={n:0,c:0});t.n++;if(ok)t.c++;S.rec.push(ok?1:0);S.rec=S.rec.slice(-20);if(!ok){S.mis.unshift({tp:k,why:why||'A slip: redo each step slowly',day:today(),q:q.o?{t:q.t,tb:q.tb,o:q.o,a:q.a,s:q.s,e:q.e,tp:q.tp,g:q.g,i:q.i,w:q.w}:null});S.mis=S.mis.slice(0,40)}save()}
const weak=()=>Object.entries(S.stat).filter(([k,v])=>v.n>=2&&v.c/v.n<.7).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(x=>x[0]);
async function aiQs(t,n){const topics=t&&t.length?t.map(lab).join(', '):'percentages, investing returns, interest, profit and loss, break-even';
const prompt=`Write ${n} NEW multiple-choice questions for an Indian student preparing for a business aptitude test (Anandi NEAT). Topics: ${topics}. Difficulty: ${LVN[S.lv-1].toLowerCase()}. Use rupees and very simple wording. Each has 4 options, exactly one correct, correct maths, a one-line idea in simple words, and 3 to 5 short plain-English solution steps. Return ONLY a JSON array like [{"t":"question","o":["a","b","c","d"],"a":0,"tp":"topic","i":"idea","s":["step 1","step 2"]}]`;
const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(S.model||'gemini-3.7-flash')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.key},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:1}})});
if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const a=JSON.parse(j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,''));
return a.filter(x=>x.t&&Array.isArray(x.o)&&x.o.length===4&&x.a>=0&&x.a<4&&Array.isArray(x.s)).slice(0,n).map(x=>({k:'m',g:'q',ai:1,tp:String(x.tp||'ai').slice(0,30),t:String(x.t),o:x.o.map(String),a:+x.a,i:x.i,s:x.s.map(String)}))}

rev(){app.innerHTML=bar()+`<h2>Explanations</h2><p class=mu>Tap any <u class=gl data-k=markup>underlined word</u> to learn it</p>`+LOG.map((x,i)=>`<div class=card><p><b>Q${i+1}.</b> ${hl(x.t)}</p>${x.tb?tbl(x.tb):''}<p class="${x.ok?'g':'r'}"><b>${x.ok?'✓ Correct':'✗ Not quite'}</b> · You: ${E(x.mine)}${x.ok||!x.right?'':' · Right: '+E(x.right)}</p>${!x.ok&&x.why?`<p>⚠ <b>Why:</b> ${E(x.why)}</p>`:''}${x.i?`<p>💡 ${hl(x.i)}</p>`:''}<ol class=st>${x.s.map(l=>`<li>${hl(l)}</li>`).join('')}</ol></div>`).join('')+`<button class="b p" onclick="go('home')">Done</button>`;window.scrollTo(0,0)},
learn(){app.innerHTML=bar()+`<h2>Learn the words</h2><p class=mu>Tap a word for a plain meaning and a bike example</p><div class=row style="flex-wrap:wrap">${Object.entries(GL).map(([k,v])=>`<button class=b style="width:auto;padding:8px 12px;margin:4px" onclick="gl('${k}')">${E(v[0])}</button>`).join('')}</div><h2>Formulas</h2>${F.map(([a,b])=>`<div class=card><p><b>${hl(a)}</b><br>${E(b)}</p></div>`).join('')}<button class=b onclick="go('home')">Back</button>`},
me(){const ent=Object.entries(S.stat).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n),tot=S.rec.length?Math.round(S.rec.reduce((a,b)=>a+b,0)/S.rec.length*100):0,why={};S.mis.forEach(m=>why[m.why]=(why[m.why]||0)+1);const tw=Object.entries(why).sort((a,b)=>b[1]-a[1]).slice(0,3);
app.innerHTML=bar()+`<h2>My progress</h2><p class=mu>Level ${1+Math.floor(S.xp/250)} · last ${S.rec.length} answers: ${tot}% right</p><p class=mu>Difficulty</p><div class=row>${LVN.map((n,i)=>`<button class="b${S.lv===i+1?' p':''}" data-lv=${i+1}>${n}</button>`).join('')}</div><h2>By topic</h2>`+(ent.length?ent.map(([k,v])=>{const p=Math.round(v.c/v.n*100);return`<p>${E(lab(k))} <span class=mu>${v.c}/${v.n}${v.n>=2&&p<70?' · needs work':''}</span></p><div class=pb><i style="width:${p}%;${p<70?'background:var(--bad)':''}"></i></div>`}).join(''):'<p class=mu>Do a quiz and your topics will show up here.</p>')+(tw.length?`<h2>Where you slip</h2><ul>${tw.map(([k,v])=>`<li>${E(k)} <span class=mu>×${v}</span></li>`).join('')}</ul>`:'')+`<button class="b p" onclick="smart()">Practice my weak spots</button><button class=b onclick="go('home')">Back</button>`;
app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S.lv=+b.dataset.lv;save();go('me')})},
blitz(){LOG=[];const R=Math.random;let end=Date.now()+6e4,sc=0,c=0,n=0,cb=0,q;
app.innerHTML=bar()+`<div class=tm><i id=tb></i></div><p class=mu id=st></p><h2 id=bq></h2><form id=f><input id=ai inputmode=decimal autocomplete=off><button class="b p" style="text-align:center">Go</button></form><button class=b id=sk style="text-align:center">Skip</button><p id=fx class=mu></p>`;
const nq=()=>{do{const gi=pick(R,pool());q=G[gi](R);q.tp=GM[gi][0]}while(q.a<0);n++;$('#bq').innerHTML=hl(q.t);$('#ai').value='';$('#ai').placeholder=q.u||'number';$('#st').textContent=`Score ${sc} · combo ${cb}`};
const fin=()=>{LOG=LOG.sort((a,b)=>a.ok-b.ok).slice(0,15);n--;S.xp+=Math.round(sc/2);S.best=Math.max(S.best,sc);save();sync('blitz',sc,c,n);app.innerHTML=bar()+`<div class=big>${sc}</div><p>${c} correct of ${n} · best ${S.best}</p><button class="b p" onclick="go('rev')">See explanations</button><button class=b onclick="go('blitz')">Play again</button><button class=b onclick="go('home')">Home</button>`};
nq();$('#ai').focus();
$('#f').onsubmit=e=>{e.preventDefault();const x=parseFloat($('#ai').value.replace(/[₹,%\s,]/g,''));if(isNaN(x))return;const ok=Math.abs(x-q.a)<=Math.max(.01,Math.abs(q.a)*.005);const tw=ok?'':(q.d||[]).some(v=>Math.abs(v-x)<.01)?TW[q.tp]:'Check each step once more';track(q,ok,tw);LOG.push({t:q.t,mine:String(x),right:fv(q.a,q.u),ok,why:tw,i:ID[q.tp],s:q.e.split(/; | → /)});if(ok){c++;cb++;sc+=10+Math.min(cb,10);$('#fx').textContent=''}else{cb=0;$('#fx').textContent='✗ '+fv(q.a,q.u)}nq();$('#ai').focus()};
$('#sk').onclick=()=>{track(q,false,'You skipped it');LOG.push({t:q.t,mine:'skipped',right:fv(q.a,q.u),ok:false,why:'You skipped it',i:ID[q.tp],s:q.e.split(/; | → /)});cb=0;$('#fx').textContent='Skipped: '+fv(q.a,q.u);nq()};
T=setInterval(()=>{const l=end-Date.now();$('#tb').style.width=Math.max(0,l/600)+'%';if(l<=0){clearInterval(T);fin()}},200)},
async board(m){app.innerHTML=bar()+`<h2>Leaderboard</h2><div class=row><button class=b onclick="go('board','blitz')">Blitz</button><button class=b onclick="go('board','daily')">Daily</button></div><div id=lb class=mu>Loading…</div><button class=b onclick="go('home')">Back</button>`;
try{const d=await sb(`scores?select=player,score,day&mode=eq.${m}&order=score.desc&limit=15`);$('#lb').innerHTML=d.length?`<table>${d.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.player)}</td><td><b>${x.score}</b></td><td class=mu>${x.day}</td></tr>`).join('')}</table>`:'No scores yet'}catch(e){$('#lb').textContent=S.sb.url?'Could not load (offline?)':'Add your Supabase URL and key in Settings'}},
set(){app.innerHTML=bar()+`<h2>Settings</h2><input id=nm placeholder="Your name" value="${E(S.name)}"><p class=mu>AI questions (Gemini)</p><input id=ak type=password placeholder="AI key" value="${E(S.key)}"><input id=am placeholder="AI model" value="${E(S.model||'gemini-3.7-flash')}"><button class=b id=ta>Test AI</button><p class=mu>Supabase (optional)</p><input id=su placeholder="Supabase project URL" value="${E(S.sb.url)}"><input id=sk2 placeholder="Supabase publishable (anon) key" value="${E(S.sb.key)}"><button class="b p" id=sv>Save</button><p class=mu id=ms></p><button class=b onclick="go('home')">Back</button>`;
const sv=()=>{S.name=$('#nm').value.trim().slice(0,24);S.key=$('#ak').value.trim();S.model=$('#am').value.trim()||'gemini-3.7-flash';S.sb={url:$('#su').value.trim(),key:$('#sk2').value.trim()};save()};
$('#ta').onclick=async()=>{sv();$('#ms').textContent='Testing…';try{const q=await aiQs(null,1);$('#ms').textContent=q.length?'AI works ✓':'AI replied, but not in the right format'}catch(e){$('#ms').textContent='AI failed: '+(e.message||e)}};
$('#sv').onclick=async()=>{sv();$('#ms').textContent='Saved.';if(S.sb.url&&S.sb.key){try{const n=await loadRemote();flush();$('#ms').textContent=`Saved · connected · ${n} extra questions`}catch(e){$('#ms').textContent='Saved, but could not reach Supabase'}}}}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
flush();if(S.sb.url&&S.sb.key)loadRemote().catch(()=>{});go('home');
</script></body></html>
